# Auto-deploy to Cloudflare on every push to main.
#
# WHY THIS EXISTS. Deploys used to be a thing someone ran by hand, so what was
# live drifted from what was on main — at one point the site served a build
# 213 commits behind and nobody could tell from the outside, because "last
# deployed 7 hours ago" looks identical whether that is "no changes since" or
# "nobody remembered to deploy". This closes that gap: main IS what is live.
#
# The alternative is Cloudflare's own Git integration (docs/deploy-cloudflare.md
# describes setting it up in the dashboard). Both work. This one lives in the
# repo, so the build command is reviewed like any other code and the deploy
# runs the same `npm run build:static` a developer runs locally — with the
# dashboard flow, the build command is a text field in a web UI that nothing
# in the repo can see or verify.
name: deploy-cloudflare

on:
  push:
    branches: [main]
  # so a deploy can be re-run without an empty commit
  workflow_dispatch:

# A push landing while an earlier deploy is still running should supersede it,
# not race it: two wrangler uploads finishing out of order would leave the
# older build live. Never cancel a run mid-upload, though — cancel-in-progress
# is deliberately false so a half-uploaded asset set is not left behind.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # `npm run build` is the VERCEL build: it emits a server bundle and no
      # out/, so wrangler would find nothing to upload. build:static is the one
      # that writes the plain file tree. See docs/deploy-cloudflare.md.
      - name: Build static export
        env:
          # metadataBase bakes the canonical URL and the absolute og:image into
          # the HTML at BUILD time. Unset, it falls back to localhost:3000 and
          # ships share cards pointing at a developer's machine.
          NEXT_PUBLIC_SITE_URL: https://floored.pages.dev
        run: npm run build:static

      # Cheap guard against the failure that is invisible until a player hits
      # it: out/ exists but is empty, or the donor material in
      # public/assets-staging (739 MB, CC-BY, never shipped) survived the
      # prune and is about to be published at a public URL.
      - name: Verify the export before publishing it
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — build:static produced nothing"; exit 1; }
          test -f out/_headers  || { echo "::error::out/_headers missing — cache rules would be silently lost"; exit 1; }
          if [ -d out/assets-staging ]; then
            echo "::error::out/assets-staging survived the prune — refusing to publish donor material"; exit 1
          fi
          big=$(find out -type f -size +25M | head -5)
          if [ -n "$big" ]; then
            echo "::error::files exceed Cloudflare's 25 MiB per-file limit:"; echo "$big"; exit 1
          fi
          echo "out/: $(find out -type f | wc -l) files, $(du -sh out | cut -f1)"

      # Pinned rather than bare `npx wrangler`, which resolves whatever is
      # latest at run time — a deploy path that changes under you without a
      # commit is exactly what this workflow exists to stop.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.130.0 pages deploy out \
            --project-name floored \
            --branch main \
            --commit-dirty=true
